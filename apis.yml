aid: artisight
name: Artisight
description: 'Artisight is a smart hospital platform company founded in 2015 out of
  Northwestern Medicine that pairs NVIDIA GPU-powered edge sensors — dual 4K cameras,
  multi-microphone arrays and RTLS radios — with computer vision, speech recognition
  and deep learning to deliver virtual nursing, ambient clinical documentation, operating-room
  coordination, patient-safety monitoring, asset and staff tracking, environmental
  monitoring and predictive analytics across 400+ hospitals in 30+ US health systems.
  The platform integrates natively and bi-directionally with Epic and Oracle Cerner
  EHRs, processes video on-premise rather than in the public cloud, and holds HIPAA
  Expert Determination Certification. Artisight publishes no public developer program,
  product API or SDK; its only public machine-readable surfaces are the WordPress content
  REST API, an OAuth 2.0-protected MCP server and an llms.txt on artisight.com.'
