apis:
- aid: artisight:website-content-api
  name: Artisight Website Content API
  description: 'The public WordPress REST API served from artisight.com. It is the
    marketing/content API for the corporate website — posts, pages, media, taxonomies,
    case studies and the site route index — not a clinical or Smart Hospital Platform
    API. Anonymous reads work; writes and the wp-abilities/v1 surface require authentication.
    523 routes across 28 namespaces were observed live on 2026-08-02.'
  humanURL: https://artisight.com/
  baseURL: https://artisight.com/wp-json/
  tags:
