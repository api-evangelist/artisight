- aid: artisight:mcp-server
  name: Artisight MCP Server
  description: 'A Model Context Protocol server published from artisight.com by the
    WordPress MCP Adapter, backed by the WordPress Abilities API. Discovery is anonymous
    — RFC 8414 authorization-server metadata and RFC 9728 protected-resource metadata
    are both served from /.well-known/ — but initialize, tools/list and the underlying
    wp-abilities/v1 routes all return 401 without an OAuth bearer token, so the live
    tool set could not be enumerated anonymously.'
  humanURL: https://artisight.com/
  baseURL: https://artisight.com/wp-json/mcp/mcp-oauth-server
  tags:
  - MCP
  - Agents
  properties:
